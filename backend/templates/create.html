{% extends "base.html" %}

{% block title %}Créer un article - Discord Blog{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-md p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Créer un nouvel article</h1>
    
    <form id="article-form" class="space-y-6">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Titre</label>
            <input type="text" id="title" name="title" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        
        <div>
            <label for="slug" class="block text-sm font-medium text-gray-700 mb-2">Slug (URL)</label>
            <input type="text" id="slug" name="slug" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            <p class="mt-1 text-sm text-gray-500">L'URL de votre article (ex: mon-premier-article)</p>
        </div>
        
        <div>
            <label for="excerpt" class="block text-sm font-medium text-gray-700 mb-2">Résumé</label>
            <textarea id="excerpt" name="excerpt" rows="3"
                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>
        
        <div>
            <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Contenu (Markdown)</label>
            <textarea id="content" name="content" rows="15" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 font-mono"></textarea>
            <p class="mt-1 text-sm text-gray-500">Utilisez la syntaxe Markdown pour formater votre article</p>
        </div>
        
        <div class="flex items-center">
            <input type="checkbox" id="published" name="published"
                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
            <label for="published" class="ml-2 block text-sm text-gray-700">Publier immédiatement</label>
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700">
                Créer l'article
            </button>
            <a href="/" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-400">
                Annuler
            </a>
        </div>
    </form>
    
    <div id="upload-section" class="mt-8 border-t pt-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Upload d'images</h2>
        <input type="file" id="image-upload" accept="image/*" class="mb-4">
        <button onclick="uploadImage()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">
            Uploader l'image
        </button>
        <div id="upload-result" class="mt-4"></div>
    </div>
</div>

<script>
// Générer le slug automatiquement depuis le titre
document.getElementById('title').addEventListener('input', function(e) {
    const slug = e.target.value
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/[-\s]+/g, '-')
        .trim();
    document.getElementById('slug').value = slug;
});

// Upload d'image
async function uploadImage() {
    const fileInput = document.getElementById('image-upload');
    if (!fileInput.files[0]) {
        alert('Veuillez sélectionner une image');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    try {
        const response = await fetch('/api/images/upload', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Erreur lors de l\'upload');
        }
        
        const image = await response.json();
        const imageUrl = `/uploads/${image.filename}`;
        const markdown = `![${image.original_filename}](${imageUrl})`;
        
        // Insérer dans le textarea
        const content = document.getElementById('content');
        const start = content.selectionStart;
        const end = content.selectionEnd;
        const text = content.value;
        content.value = text.substring(0, start) + markdown + text.substring(end);
        content.focus();
        content.setSelectionRange(start + markdown.length, start + markdown.length);
        
        document.getElementById('upload-result').innerHTML = 
            `<p class="text-green-600">Image uploadée avec succès !</p>`;
        fileInput.value = '';
    } catch (error) {
        document.getElementById('upload-result').innerHTML = 
            `<p class="text-red-600">Erreur: ${error.message}</p>`;
    }
}

// Soumettre le formulaire
document.getElementById('article-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        content: document.getElementById('content').value,
        excerpt: document.getElementById('excerpt').value,
        published: document.getElementById('published').checked
    };
    
    try {
        const response = await fetch('/api/articles/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Erreur lors de la création');
        }
        
        const article = await response.json();
        window.location.href = `/article/${article.slug}`;
    } catch (error) {
        alert('Erreur: ' + error.message);
    }
});
</script>
{% endblock %}
