{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-4xl font-bold text-gray-900">Articles</h1>
    
    <div id="articles-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <!-- Les articles seront chargés ici via JavaScript -->
    </div>
</div>

<script>
async function loadArticles() {
    try {
        const response = await fetch('/api/articles/?published_only=true');
        const articles = await response.json();
        
        const container = document.getElementById('articles-list');
        if (articles.length === 0) {
            container.innerHTML = '<p class="text-gray-600">Aucun article publié pour le moment.</p>';
            return;
        }
        
        container.innerHTML = articles.map(article => `
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="p-6">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">
                        <a href="/article/${article.slug}" class="hover:text-indigo-600">${article.title}</a>
                    </h2>
                    ${article.excerpt ? `<p class="text-gray-600 mb-4">${article.excerpt}</p>` : ''}
                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span>Par ${article.author.username}</span>
                        <span>${new Date(article.created_at).toLocaleDateString('fr-FR')}</span>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Erreur lors du chargement des articles:', error);
        document.getElementById('articles-list').innerHTML = 
            '<p class="text-red-600">Erreur lors du chargement des articles.</p>';
    }
}

loadArticles();
</script>
{% endblock %}
