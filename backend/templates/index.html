{% extends "base.html" %}

{% block content %}
<div class="space-y-4 sm:space-y-6">
    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-900 dark:text-white">Articles</h1>
    
    <!-- Barre de recherche -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 transition-colors duration-200">
        <div class="relative">
            <input type="text" id="search-input" placeholder="Rechercher par nom d'article ou tag..." 
                   class="w-full px-4 py-2 pl-10 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center">
                <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <div id="articles-list" class="grid gap-4 sm:gap-6 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
        <!-- Les articles seront chargés ici via JavaScript -->
    </div>
</div>

<script>
let allArticles = [];
let searchTerm = '';

async function loadArticles() {
    try {
        const response = await fetch('/api/articles/?published_only=true');
        allArticles = await response.json();
        displayArticles();
    } catch (error) {
        console.error('Erreur lors du chargement des articles:', error);
        document.getElementById('articles-list').innerHTML = 
            '<p class="text-red-600">Erreur lors du chargement des articles.</p>';
    }
}

function displayArticles() {
    const container = document.getElementById('articles-list');
    
    // Filtrer les articles selon la recherche
    let filtered = allArticles;
    if (searchTerm.trim() !== '') {
        const searchLower = searchTerm.toLowerCase().trim();
        filtered = allArticles.filter(article => {
            // Recherche par titre
            const titleMatch = article.title.toLowerCase().includes(searchLower);
            
            // Recherche par tag
            const tagMatch = article.tags && article.tags.some(tag => 
                tag.name.toLowerCase().includes(searchLower)
            );
            
            return titleMatch || tagMatch;
        });
    }
    
    if (filtered.length === 0) {
        container.innerHTML = '<p class="text-gray-600 dark:text-gray-400 col-span-full text-center py-8">Aucun article trouvé.</p>';
        return;
    }
    
    const html = filtered.map(article => {
        const title = escapeHTML(article.title || '');
        const slug = escapeHTML(article.slug || '');
        const excerpt = article.excerpt ? escapeHTML(article.excerpt) : '';
        const author = escapeHTML(article.author?.username || '');
        const date = article.created_at ? new Date(article.created_at).toLocaleDateString('fr-FR') : '';
        const tagsHtml = article.tags && article.tags.length > 0 ? `
            <div class="flex flex-wrap gap-2 mb-3">
                ${article.tags.map(tag => {
                    const tagName = escapeHTML(tag.name || '');
                    const tagColor = escapeHTML(tag.color || '#3b82f6');
                    return `<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium" 
                                  style="background-color: ${tagColor}20; color: ${tagColor};">
                                ${tagName}
                            </span>`;
                }).join('')}
            </div>
        ` : '';
        
        return `
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <div class="p-4 sm:p-6">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white mb-2">
                        <a href="/article/${slug}" class="hover:text-indigo-600 dark:hover:text-indigo-400">${title}</a>
                    </h2>
                    ${excerpt ? `<p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mb-4">${excerpt}</p>` : ''}
                    ${tagsHtml}
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
                        <span>Par ${author}</span>
                        <span>${date}</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    setSafeHTML(container, html);
}

// Recherche en temps réel
document.getElementById('search-input').addEventListener('input', function(e) {
    searchTerm = e.target.value;
    const clearBtn = document.getElementById('clear-search');
    
    if (searchTerm.trim() !== '') {
        clearBtn.classList.remove('hidden');
    } else {
        clearBtn.classList.add('hidden');
    }
    
    displayArticles();
});

// Bouton pour effacer la recherche
document.getElementById('clear-search').addEventListener('click', function() {
    document.getElementById('search-input').value = '';
    searchTerm = '';
    this.classList.add('hidden');
    displayArticles();
});

loadArticles();
</script>
{% endblock %}
